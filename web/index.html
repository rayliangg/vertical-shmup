<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vertical Shmup</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="cabinet">
    <header class="marquee">
      <h1>VERTICAL SHMUP</h1>
    </header>

    <div class="cabinet-body">
      <div class="bezel">
        <canvas id="game" width="760" height="720" tabindex="0" aria-label="遊戲畫面"></canvas>
      </div>

      <aside class="console">
        <div class="btn-row">
          <button id="btn-play" class="arcade green">自己玩</button>
          <button id="btn-autopilot" class="arcade blue">AI 開車</button>
        </div>
        <div class="btn-row">
          <button id="btn-boss" class="arcade yellow">直接打魔王</button>
          <button id="btn-stage" class="arcade yellow">下一關魔王</button>
        </div>
        <div class="btn-row">
          <a href="compare.html" class="arcade green compare-link">四個 agent 一起比較</a>
        </div>
        <div class="btn-row small">
          <button data-speed="1" class="chip">x1</button>
          <button data-speed="2" class="chip">x2</button>
          <button data-speed="4" class="chip">x4</button>
          <button id="btn-view" class="chip">危險格</button>
          <button id="btn-mute" class="chip">音效</button>
        </div>

        <div class="ai-box">
          <div class="ai-title">AI 模型（選訓練到第幾回合）</div>
          <select id="model-select" class="model-select" aria-label="選擇模型"></select>
          <p class="ai-note" id="model-info"></p>
          <p class="ai-note">AI 對這一步的把握：<b id="joy-q">--</b></p>
          <p class="ai-note">AI 跑了 <b id="stat-runs">0</b> 局，平均 <b id="stat-avg">-</b> 分</p>
        </div>

        <div class="howto">
          <div><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> 移動</div>
          <div><kbd>Shift</kbd> 慢速　<kbd>X</kbd> 炸彈</div>
          <div><kbd>Tab</kbd> AI 開車　<kbd>V</kbd> 危險格</div>
          <div><kbd>P</kbd> 暫停　<kbd>M</kbd> 靜音</div>
        </div>
      </aside>
    </div>

    <footer>
      素材：Kenney（CC0）／音樂：Matthew Pablo &ldquo;Orbital Colossus&rdquo;（CC-BY 3.0）
    </footer>
  </div>

  <script src="js/rules.js"></script>
  <script src="js/core.js"></script>
  <script src="model/manifest.js" onerror="console.info('還沒有匯出模型')"></script>
  <script src="js/agent.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
